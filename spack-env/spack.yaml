# Spack environment that reproducibly builds SW4 from this fork.
#
# Do not run `spack install` in here directly -- use ../install.sh, which
# bootstraps a private Spack, discovers the host compiler and MPI, writes
# host/host.yaml, and then concretizes and installs this environment.
#
# Host components, both deliberate: the C/C++/Fortran compiler and MPI. Every
# other dependency -- PROJ, HDF5, FFTW, OpenBLAS and their transitive deps -- is
# built by Spack with that compiler.
spack:
  specs:
  - sw4 %host_toolchain

  include:
  # Host-discovered configuration: the host_toolchain definition, the compiler
  # and MPI externals, and the pinned sw4 commit. Generated by ../install.sh -- if this
  # file is missing, you have not run it yet.
  - path: host/host.yaml
    optional: false

  repos:
    # Fork-specific sw4 recipe; shadows builtin.sw4. Relative to this file --
    # $env is expanded when concretizing but not inside build subprocesses.
    sw4_ucgmsim: repo/spack_repo/sw4_ucgmsim
    # Pin the builtin recipes to a commit. The Spack default tracks the
    # `releases/v2026.06` *branch*, which moves under you.
    builtin:
      git: https://github.com/spack/spack-packages.git
      commit: 119680aeee8ea802c6111b7167583bddef97e82f

  concretizer:
    # Never reuse whatever happens to be installed elsewhere on the machine: the
    # concrete DAG is then a function of (Spack version, pinned recipe commit,
    # this file, and the discovered host compiler/MPI) alone.
    reuse: false
    unify: true

  packages:
    all:
      # Every node in the DAG uses the one host compiler. This is a hard
      # requirement rather than a preference only because the compiler is
      # external: an external has no dependencies of its own, so there is no
      # gcc -> gmp -> gcc cycle. Pointing this at a Spack-*built* GCC instead
      # makes the same line unsatisfiable.
      require:
      - "%host_toolchain"
      providers:
        blas: [openblas]
        lapack: [openblas]

  view:
    default:
      root: .spack-env/view
