description = "AN-03: the AN-02 point source near a mesh refinement interface (refinement zmax=2.0; fine spacing 0.025 above, 0.05 below). Fault planes in the workflow cross refinement boundaries, so placing the source on, just above, or just below the interface must not make the error worse than a run with no interface at the coarse spacing (Petersson & Sjogreen 2010). Measured 2026-10-08 (double): exactly on the interface errInf is 1.86x the no-interface run, other positions 1.0-1.5x; the guard is 2x. Nightly: resolving the waves needs h=0.05 (at h=0.1 the error is about 50% and the comparison is meaningless)."
labels = ["analytic", "pointsource", "mr", "supergrid"]
input = "pointsource.in"
ranks = 4

[params]
L = 5.0
xs = 2.5
t = 2.0
freq = 1.0
h = 0.05
sgw = 1.0
refinement = "refinement zmax=2.0"

[[run]]
tier = "nightly"
name = "uniform"
params = { zs = 2.0, refinement = "" }

[[run]]
tier = "nightly"
name = "at"
params = { zs = 2.0 }

[[run]]
tier = "nightly"
name = "above-half-fine"
params = { zs = 1.975 }

[[run]]
tier = "nightly"
name = "below-half-coarse"
params = { zs = 2.05 }

[[run]]
tier = "nightly"
name = "below-one-coarse"
params = { zs = 2.1 }

[[check]]
name = "golden"
kind = "err_golden"
file = "PointSourceErr.txt"

[[check]]
name = "bounded"
kind = "err_ratio"
file = "PointSourceErr.txt"
reference = "uniform"
max_ratio = 2.0
