description = "ST-01: long-time stability of a homogeneous half-space (one grid, sponge 12 points, default supergrid damping). The damping term is stable at every CFL-stable time step only if dc times the largest eigenvalue of the 1-D damping operator is <= 1/2; that eigenvalue grows as the layer narrows (33 at 12 points, 18 at 30), so the old default dc=0.02 on 12 points (product 0.67) grew without bound from t~20 s at CFL >= 1.0 (stable at 0.9, with dc=0, or with a 20-point sponge). SW4 now reduces a default dc to fit the layer (to 0.0135 here) and warns about an explicit one, so the default-CFL run must stay bounded; the explicit dc=0.02 run must still blow up and be stopped by failonnan."
labels = ["stability", "supergrid", "cfl"]
input = "default-cfl.in"
generate = "eq"
ranks = 4
requires = ["hdf5", "proj"]

[params]
L = 12000.0
Z = 8000.0
h = 200.0
az = 0.0
t = 30.0
sg = "width=2400"
topo = ""
rho = 2500.0
vs = 2300.0
material = "block vp=4000 vs=2300 rho=2500"
source = "rupturehdf5 file=src.srf.h5"
recvars = ""
rec = ""
station_mode = "xy"
stations = [["A", 2000, 0]]
cfl = ""

[[run]]
name = "cfl0.9"
params = { cfl = "developer cfl=0.9" }

[[run]]
name = "default-cfl"

[[run]]
name = "default-cfl-failonnan"
params = { cfl = "developer failonnan=1", sg = "width=2400 dc=0.02" }
expect = "failure"
xfail = { double = "failonnan did not stop this run: it overflowed to Inf around t=22 s and still exited 0 (in float the same run is caught at t=15 s)." }

[[check]]
name = "bounded-cfl0.9"
kind = "traces_bounded"
runs = ["cfl0.9"]

[[check]]
name = "bounded-default-cfl"
kind = "traces_bounded"
runs = ["default-cfl"]

[[check]]
name = "default-dc-reduced"
kind = "stdout_present"
runs = ["default-cfl"]
patterns = ["Supergrid damping coefficient reduced from 2\\.0+e-02 to 1\\.3"]

[[check]]
name = "explicit-dc-warned"
kind = "stdout_present"
runs = ["default-cfl-failonnan"]
patterns = ["WARNING: supergrid dc=2\\.0+e-02 is above the stability limit .* a layer of at least 15 grid points"]
