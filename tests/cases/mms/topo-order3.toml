description = "MMS-03b: as MMS-03 with mapping order 3, the workflow's setting. Asserts 4th order. Measured (double, zetabreak=0.8): L2 4.27 (h1-h2), 4.31 (h2-h3); max norm 3.56, 4.54. Before the curvilinear/Cartesian join was made energy-exact (zetaBreak capped at (Nz-5)/(Nz-1), default 0.95 here) L2 converged at about 3rd order only (2.76, 2.83), max norm 3.2-3.3."
labels = ["mms", "twilight", "curvi"]
input = "topo.in"
ranks = 4

