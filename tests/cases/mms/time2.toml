tier = "nightly"
params = { nx = 41, h = 0.157 }

[[run]]
name = "h2"
tier = "nightly"
params = { nx = 81, h = 0.0785 }

[[run]]
name = "h3"
tier = "nightly"
params = { nx = 161, h = 0.03925 }

[[check]]
name = "golden"
kind = "twilight_golden"
