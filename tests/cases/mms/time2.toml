description = "MMS-11: 2nd order time stepping across a refinement interface with attenuation (ports meshrefine/refine-att-2nd). Asserts 2nd order. Nightly only: the workflow uses 4th order time stepping, and the time error only dominates at sizes too slow for the PR tier."
labels = ["mms", "twilight", "mr", "atten"]
input = "time2.in"
ranks = 4

[params]
t = 1.0
cfl = 0.6

[[run]]
