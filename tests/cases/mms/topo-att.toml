description = "Twilight with attenuation and supergrid stretching under steep Gaussian topography (ports attenuation/tw-topo-att). Asserts 4th order."
labels = ["mms", "twilight", "curvi", "atten", "supergrid"]
input = "topo-att.in"
ranks = 4

[params]
t = 0.5
cfl = 0.9

[[run]]
name = "h1"
params = { nx = 41, h = 0.157 }

[[run]]
name = "h2"
params = { nx = 81, h = 0.0785 }

[[run]]
name = "h3"
tier = "nightly"
