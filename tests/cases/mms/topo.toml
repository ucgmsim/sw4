description = "MMS-03: twilight on a curvilinear grid under Gaussian topography, mapping order 4. Asserts 4th order. zetabreak=0.8 in topo.in keeps the same grid family on all three grids (SW4 caps zetabreak at (Nz-5)/(Nz-1), but not below 0.8; Nz = 9, 17, 33). Measured (double): L2 4.17 (h1-h2), 4.30 (h2-h3); max norm 2.99, 4.24: the coarse pair is pre-asymptotic in the max norm (nz = 9), hence its wider band."
labels = ["mms", "twilight", "curvi"]
input = "topo.in"
ranks = 4

[params]
t = 0.8
cfl = 0.9
order = 4

[[run]]
name = "h1"
params = { nx = 31, h = 0.03333333333333333 }

[[run]]
name = "h2"
params = { nx = 61, h = 0.016666666666666666 }

[[run]]
name = "h3"
tier = "nightly"
params = { nx = 121, h = 0.008333333333333333 }

[[check]]
name = "golden"
kind = "twilight_golden"
runs = ["h1", "h2"]

[[check]]
name = "rate"
kind = "rate"
runs = ["h1", "h2"]
expect = 4.0
band = 0.4
band_errInf = 1.1

[[check]]
name = "rate-nightly"
kind = "rate"
expect = 4.0
band = 0.4
band_errInf = 0.9
