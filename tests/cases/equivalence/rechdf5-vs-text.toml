description = "EQ-06: the same receivers written by rechdf5 (the workflow's output) and by `rec usgsformat=1` text agree: isolates the HDF5 writer. Stations are given as grid x,y: with lat/lon, a 1e-5 m round-off difference between the two input paths moves a receiver a whole cell (see workflow/mininz receiver-placement)."
labels = ["equivalence", "rechdf5", "hdf5"]
input = "eq.in"
generate = "eq"
ranks = 4
requires = ["hdf5", "proj"]

[params]
L = 12000.0
Z = 6000.0
h = 200.0
az = 0.0
t = 5.0
sg = "width=2400"
topo = ""
rho = 2500.0
vs = 2300.0
material = "block vp=4000 vs=2300 rho=2500"
source = "rupturehdf5 file=src.srf.h5"
recvars = ""
rec = ""

[[run]]
name = "both"
params = { rec = "{{rec_lines}}", station_mode = "xy" }

# A text receiver named like rechdf5 station N (sta=N), at another position,
# plus a second rechdf5 command writing velocity to its own file.
[[run]]
name = "clash"
params = { rec = "rec x=1000 y=1000 z=0 sta=N file=clashN usgsformat=1 sacformat=0 nsew=1\nrechdf5 infile=stations.h5 outfile=vel.h5 variables=velocity", station_mode = "xy" }

[[check]]
name = "agree"
kind = "traces_agree"
runs = ["both", "both"]
b_format = "usgs"
b_strip = "txt"
a_ignore = "txt"
rtol = { double = 1e-6, float = 1e-5 }

[[check]]
name = "no-extra-groups"
kind = "rechdf5_only_requested"
runs = ["both"]
description = "Text `rec` receivers must not leak into the rechdf5 file: the workflow reader requires NPTS equal across its groups."

[[check]]
name = "name-clash-intact"
kind = "traces_agree"
runs = ["both", "clash"]
a_ignore = "txt"
bitwise = true
description = "A text receiver sharing rechdf5 station N's name leaves out.h5 untouched: identical to the run without it."

[[check]]
name = "name-clash-no-extra-groups"
kind = "rechdf5_only_requested"
runs = ["clash"]
files = ["out.h5", "vel.h5"]
description = "Each rechdf5 outfile holds exactly its infile's stations, with data, however many rechdf5 and rec commands the run has."

[[check]]
name = "component-metadata"
kind = "rechdf5_components"
runs = ["clash"]
files = ["out.h5", "vel.h5"]
description = "Per-component CMPAZ/CMPINC for displacement (NS/EW/UP) and velocity (Vns/Vew/Vup) output."
