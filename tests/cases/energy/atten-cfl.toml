description = "EN-05: regression test for the attenuation/CFL instability fixed in 6f62621b (memory variables recomputed from the corrected displacement). Before the fix this input grows by 1.5% per step at CFL 1.3 (energy 2.6e16 -> 7.8e27 by t=80); after it the energy decays. Nightly sweeps CFL up to just below the 1.5 limit."
labels = ["energy", "atten", "cfl"]
input = "atten-cfl.in"
ranks = 4

[params]
t = 40.0

[[run]]
name = "cfl1.3"
params = { cfl = 1.3 }

[[run]]
name = "cfl1.0"
tier = "nightly"
params = { cfl = 1.0, t = 200.0 }

[[run]]
name = "cfl1.1"
tier = "nightly"
params = { cfl = 1.1, t = 200.0 }

[[run]]
name = "cfl1.3-long"
tier = "nightly"
params = { cfl = 1.3, t = 200.0 }

[[run]]
name = "cfl1.45"
tier = "nightly"
params = { cfl = 1.45, t = 200.0 }

[[check]]
name = "decay"
kind = "energy"
mode = "decay"
runs = ["cfl1.3"]

[[check]]
name = "decay-sweep"
kind = "energy"
mode = "decay"
runs = ["cfl1.0", "cfl1.1", "cfl1.3-long", "cfl1.45"]
