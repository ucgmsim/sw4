description = "EN-04: EN-02 with attenuation nmech=3 maxfreq=10 phasefreq=0.5 (the workflow settings) and Vp/Vs 3.6: the energy never increases. Covers the attenuation/CFL instability found 2026-07 (unstable at CFL 1.3, stable at <= 1.1)."
labels = ["energy", "curvi", "mr", "atten"]
input = "energy.in"
ranks = 4

[params]
xy = 12.0
cfl = 0.9
dev = ""
z = 26.0
nx = 13
t = 10.0
topo = "topography input=gaussian zmax=6 order=3 gaussianAmp=2 gaussianXc=6 gaussianYc=6.5 gaussianLx=2.5 gaussianLy=3"
refinements = "refinement zmax=9\nrefinement zmax=15"
atten = "attenuation nmech=3 maxfreq=10 phasefreq=0.5"
sg = ""
cpcs = 3.6
bch = "dirichlet"
teextra = ""

[[run]]
name = "pr"

[[run]]
name = "long"
tier = "nightly"
params = { t = 300.0 }

[[check]]
name = "energy"
kind = "energy"
runs = ["pr"]
mode = "decay"

[[check]]
name = "energy-long"
kind = "energy"
runs = ["long"]
mode = "decay"

[[check]]
name = "interface-converged"
kind = "stdout_absent"
pattern = "no convergence"
